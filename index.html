// ---------- audio ----------
let AC=null,master=null,stepT=0,bumpT=0,rumT=0,musG=null;
function initAudio(){
  if(AC){AC.resume&&AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
    startMusic();startChill();
  }catch(e){}
}
// upbeat looping track: kick, hats, bouncy bass, sparkly arpeggio and a little lead (C - Am - F - G)
function startMusic(){
  const mus=AC.createGain();mus.gain.value=0.5;mus.connect(master);musG=mus;
  const BPM=128,S=60/BPM/4;
  const chords=[[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]];
  const m2f=n=>440*Math.pow(2,(n-69)/12);
  const nb=AC.createBuffer(1,AC.sampleRate*0.1,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  function note(f,t,d,type,v){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(mus);o.start(t);o.stop(t+d+0.05);
  }
  function kick(t){
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g);g.connect(mus);o.start(t);o.stop(t+0.25);
  }
  function hat(t,v){
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=nb;f.type='highpass';f.frequency.value=7000;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    s.connect(f);f.connect(g);g.connect(mus);s.start(t);s.stop(t+0.1);
  }
  const arpPat=[0,1,2,3,2,1,3,2];
  let step=0,nextT=AC.currentTime+0.1;
  function play(n,t){
    const bar=Math.floor(n/16)%4,s=n%16,ch=chords[bar];
    if(s%4===0)kick(t);
    if(s%4===2)hat(t,0.18);else if(s%2===1)hat(t,0.05);
    if(s%2===0)note(m2f(ch[0]-12+(s%8===6?12:0)),t,S*1.8,'triangle',0.32);
    note(m2f(ch[arpPat[s%8]]+12),t,S*1.5,'triangle',0.11);
    if([0,3,6,10,12].includes(s))note(m2f(ch[(s+bar)%4]+24),t,S*2.5,'square',0.035);
  }
  setInterval(()=>{while(nextT<AC.currentTime+0.25){play(step,nextT);nextT+=S;step++}},60);
}

// slow lo-fi loop that only plays inside the Chill Room (the main track fades out there)
function startChill(){
  const cm=AC.createGain();cm.gain.value=0;cm.connect(master);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.connect(cm);
  const BPM=68,S=60/BPM/2; // eighth notes
  const m2f=n=>440*Math.pow(2,(n-69)/12);
  const chords=[[57,60,64,67,71],[53,57,60,64,67],[48,55,59,62,64],[52,55,59,62,66]]; // Am9 Fmaj9 Cmaj9 Em9
  const nb=AC.createBuffer(1,AC.sampleRate*0.2,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  function nt(f,t,d,type,v,att,dest){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest||lp);o.start(t);o.stop(t+d+0.05);
  }
  function kick(t){
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g);g.connect(cm);o.start(t);o.stop(t+0.3);
  }
  function noise(t,fq,v,d){
    const s2=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s2.buffer=nb;f.type='bandpass';f.frequency.value=fq;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    s2.connect(f);f.connect(g);g.connect(cm);s2.start(t);s2.stop(t+d+0.05);
  }
  const penta=[0,3,5,7,10];
  let step=0,nextT=0,wasOn=false;
  setInterval(()=>{
    const on=zone==='chill';
    cm.gain.setTargetAtTime(on?0.55:0,AC.currentTime,0.5);
    if(musG)musG.gain.setTargetAtTime(on?0:0.5,AC.currentTime,0.5);
    if(!on){wasOn=false;return}
    if(!wasOn){wasOn=true;step=0;nextT=AC.currentTime+0.15}
    while(nextT<AC.currentTime+0.3){
      const n=step,bar=Math.floor(n/8)%4,k=n%8,ch=chords[bar],t=nextT;
      if(k===0){ // soft pad chord + bass for the whole bar
        for(const m of ch)nt(m2f(m),t,S*8.5,'triangle',0.07,0.5);
        nt(m2f(ch[0]-24),t,S*3.5,'sine',0.3,0.02,cm);
      }
      if(k===0||k===5)kick(t);
      if(k===4)noise(t,1800,0.16,0.14);
      if(k%2===0)noise(t,7000,0.035,0.04);

function collide(){
  rig.updateMatrixWorld(true);
  const cam=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
  cam.getWorldPosition(hp);
  const H=0.8;
  for(const p of (zone==='pillars'?pillars:[])){
    const top=p.position.y+2;
    if(top<0.3||hp.y>top+0.2)continue;
    const dx=hp.x-p.position.x,dz=hp.z-p.position.z;
    if(Math.abs(dx)<H&&Math.abs(dz)<H){
      const px=H-Math.abs(dx),pz=H-Math.abs(dz);
      if(px<pz){const s=Math.sign(dx||1)*px;rig.position.x+=s;hp.x+=s}else{const s=Math.sign(dz||1)*pz;rig.position.z+=s;hp.z+=s}
      const n=performance.now();if(n-bumpT>400){sfx.bump();bumpT=n}
    }
  }
  if(zone!=='pillars'){ // walking bodies (PC / mobile) can't go through the desk stump, the mirror or the couch
    const BR=0.35;
    for(const s of zoneSolids()){
      if(rig.position.y>s.top-0.05||hp.y<s.bot)continue;
      const dx=hp.x-s.x,dz=hp.z-s.z;let pushed=false;
      if(s.k==='c'){
        const d=Math.hypot(dx,dz),R=s.r+BR;
        if(d<R){const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;rig.position.x+=nx*(R-d);rig.position.z+=nz*(R-d);hp.x+=nx*(R-d);hp.z+=nz*(R-d);pushed=true}
      }else{
        const Bx=s.hx+BR,Bz=s.hz+BR;
        if(Math.abs(dx)<Bx&&Math.abs(dz)<Bz){
          const ox=Bx-Math.abs(dx),oz=Bz-Math.abs(dz);
          if(ox<oz){const v=Math.sign(dx||1)*ox;rig.position.x+=v;hp.x+=v}else{const v=Math.sign(dz||1)*oz;rig.position.z+=v;hp.z+=v}
          pushed=true;
        }
      }
      if(pushed){const n=performance.now();if(n-bumpT>400){sfx.bump();bumpT=n}}
    }
  }
}

function makeFinger(mat,x,len,rad,yaw,y=0){

function buildFingerSet(mat,hand){

// ---------- arms: upper arm + forearm that bend at the elbow, following your real arm ----------
// Shoulder sits just below and to the side of the head; the elbow is solved so both bones keep their length.
const hq=new THREE.Quaternion(),hyV=new THREE.Vector3(),aF=new THREE.Vector3(),aR=new THREE.Vector3(),aS=new THREE.Vector3(),aH=new THREE.Vector3();
const aD=new THREE.Vector3(),aE=new THREE.Vector3(),aP=new THREE.Vector3();
const ARM1=0.30,ARM2=0.30,ARMR=0.03;
function makeArm(mat){
  const g=new THREE.Group(),up=new THREE.Mesh(beanGeo,mat),fo=new THREE.Mesh(beanGeo,mat),el=new THREE.Mesh(beanGeo,mat);
  el.scale.setScalar(ARMR*1.12);g.add(up,fo,el);
  return {g,up,fo,el,mat};
}
function placeBean(m,a,b,rad){
  const len=a.distanceTo(b);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  if(len>1e-4)m.lookAt(b);
  m.scale.set(rad,rad,Math.max(0.002,len/2));
}
function solveArm(arm,S,H,fwd,side,rightV){
  aD.subVectors(H,S);const d=aD.length();
  if(d<1e-4)return;
  aD.multiplyScalar(1/d);
  const dc=Math.min(d,ARM1+ARM2-0.002);
  const a=(ARM1*ARM1+dc*dc-ARM2*ARM2)/(2*dc),h=Math.sqrt(Math.max(0,ARM1*ARM1-a*a));
  aP.set(0,-1,0).addScaledVector(rightV,side*0.6).addScaledVector(fwd,-0.4); // elbow points down, out and a bit back
  aP.addScaledVector(aD,-aP.dot(aD));
  if(aP.lengthSq()<1e-6)aP.copy(rightV).multiplyScalar(side);
  aP.normalize();
  aE.copy(S).addScaledVector(aD,a).addScaledVector(aP,h);
  if(arm.sk){placeSeg(arm.up,S,aE);placeSeg(arm.fo,aE,H)}else{placeBean(arm.up,S,aE,ARMR);placeBean(arm.fo,aE,H,ARMR*0.9)}
  arm.el.position.copy(aE);
}
function shoulderFor(out,head,side,fwd,rightV){
  out.copy(head);out.y-=0.22;out.addScaledVector(rightV,side*0.19).addScaledVector(fwd,-0.04);
}
let localArms=[null,null],localWatch=null;
function updateLocalArms(){
  if(!renderer.xr.isPresenting){for(const a of localArms)if(a)a.g.visible=false;if(localWatch)localWatch.visible=false;return}
  renderer.xr.getCamera(camera).getWorldDirection(aF);aF.y=0;
  if(aF.lengthSq()<1e-4)aF.set(0,0,-1);aF.normalize();
  aR.set(-aF.z,0,aF.x);
  hands.forEach((c,i)=>{
    const u=c.userData;if(!u.m)return;
    const side=(u.hand?u.hand==='left':i===0)?-1:1;
    let A=localArms[i];
    if(!A||A.mat!==u.m.material){if(A)scene.remove(A.g);A=localArms[i]=makeArm(u.m.material);if(ytLocal)ytSkinArm(A,ytLocal.r,u.m.material,side===-1);scene.add(A.g)}
    A.g.visible=!!u.src;
    shoulderFor(aS,hp,side,aF,aR);
    c.getWorldPosition(aH);
    solveArm(A,aS,aH,aF,side,aR);

      if(!localWatch){localWatch=ytLocal?ytBuild(ytLocal.w,u.m.material):makeWatch();scene.add(localWatch)}
      localWatch.visible=!!u.src;

function updateFingers(dt){
  const a=1-Math.exp(-22*dt);
  for(const c of hands){
    const u=c.userData;if(!u.fingers)continue;
    const gp=u.src&&u.src.gamepad;
    const t={thumb:btn(gp,1),middle:btn(gp,0),pinky:btn(gp,4)}; // squeeze, trigger, X/A
    for(const n in u.fingers){

const dir=new THREE.Vector3(),right=new THREE.Vector3(),up=new THREE.Vector3(0,1,0),mv=new THREE.Vector3();

const SPEED=3.2;
function clampRig(){
  if(zone==='ytinu'){rig.position.x=Math.max(-9,Math.min(9,rig.position.x));rig.position.z=Math.max(-9,Math.min(9,rig.position.z));return}
  if(zone==='chill'){
    const m=CHILL_HALF-0.4;
    rig.position.x=Math.max(-m,Math.min(m,rig.position.x));
    rig.position.z=Math.max(-m,Math.min(m,rig.position.z));
    rig.position.y=Math.min(rig.position.y,CHILL_H-1.9);
    return;
  }
  if(zone==='stump'){
    const r=Math.hypot(rig.position.x,rig.position.z);
    if(r>STUMP_R){rig.position.x*=STUMP_R/r;rig.position.z*=STUMP_R/r}
    if(Math.abs(rig.position.x)<1.9&&rig.position.z<-2.6)rig.position.z=-2.6;
    return;
  }
  rig.position.x=Math.max(-ARENA,Math.min(ARENA,rig.position.x));
  rig.position.z=Math.max(-ARENA,Math.min(ARENA,rig.position.z));
}
function move(dt,sx,sy){
  const cam=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
  cam.getWorldDirection(dir);dir.y=0;
  if(dir.lengthSq()<1e-4)return;
  dir.normalize();
  right.crossVectors(dir,up).normalize();
  mv.set(0,0,0).addScaledVector(dir,-sy).addScaledVector(right,sx);
  if(mv.lengthSq()>1)mv.normalize();
  rig.position.addScaledVector(mv,SPEED*dt);
  clampRig();
  stepT-=dt;if(stepT<=0){sfx.step();stepT=0.45}
}
// Gorilla Tag style: hands are solid against the floor and pillars.
// Push off a surface with a hand and you get launched; no grip needed.
let hitT=0;
const HR=0.1,GRAV=9,MAXV=10,hw=new THREE.Vector3(),pushOut=new THREE.Vector3(),avg=new THREE.Vector3();
function handHit(w,out){
  out.set(0,0,0);let hit=false;
  if(w.y<HR){out.y=HR-w.y;hit=true}
  for(const p of (zone==='pillars'?pillars:[])){
    const top=p.position.y+2,bot=p.position.y-2;
    if(top<0.1)continue;
    const dx=w.x-p.position.x,dz=w.z-p.position.z,B=0.5+HR;
    if(Math.abs(dx)<B&&Math.abs(dz)<B&&w.y<top+HR&&w.y>bot-HR){
      const ox=B-Math.abs(dx),oz=B-Math.abs(dz),oy=top+HR-w.y;
      if(oy<=ox&&oy<=oz)out.y=Math.max(out.y,oy);
      else if(ox<oz)out.x+=Math.sign(dx||1)*ox;
      else out.z+=Math.sign(dz||1)*oz;
      hit=true;
    }
  }
  if(zone==='chill'){ // the room's walls and ceiling are solid to hands too
    const E=CHILL_HALF-HR;
    if(w.x>E){out.x-=w.x-E;hit=true}else if(w.x<-E){out.x+=-E-w.x;hit=true}
    if(w.z>E){out.z-=w.z-E;hit=true}else if(w.z<-E){out.z+=-E-w.z;hit=true}
    if(w.y>CHILL_H-HR){out.y-=w.y-(CHILL_H-HR);hit=true}
  }
  for(const s of zoneSolids()){
    if(w.y>s.top+HR||w.y<s.bot-HR)continue;
    const dx=w.x-s.x,dz=w.z-s.z,oy=s.top+HR-w.y;
    if(s.k==='c'){
      const d=Math.hypot(dx,dz),R=s.r+HR;
      if(d<R){
        const rad=R-d;
        if(oy<=rad)out.y=Math.max(out.y,oy);
        else{const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;out.x+=nx*rad;out.z+=nz*rad}
        hit=true;
      }
    }else{
      const Bx=s.hx+HR,Bz=s.hz+HR;
      if(Math.abs(dx)<Bx&&Math.abs(dz)<Bz){
        const ox=Bx-Math.abs(dx),oz=Bz-Math.abs(dz);
        if(oy<=ox&&oy<=oz)out.y=Math.max(out.y,oy);
        else if(ox<oz)out.x+=Math.sign(dx||1)*ox;
        else out.z+=Math.sign(dz||1)*oz;
        hit=true;
      }
    }
  }
  return hit;
}
function gorilla(dt){
  rig.updateMatrixWorld(true);
  avg.set(0,0,0);let n=0;
  for(const c of hands){
    const u=c.userData;
    dd.copy(c.position).sub(u.prev).applyQuaternion(rig.quaternion); // hand motion in world space
    u.prev.copy(c.position);
    c.getWorldPosition(hw);
    const hit=u.has&&handHit(hw,pushOut);
    // one thud per real hit: the hand must have been off the surface for 0.15s, and hits within 0.2s count once
    if(hit){
      const nowT=performance.now();
      if((u.air??1)>0.15&&nowT-hitT>200){sfx.thud(Math.min(1,dd.length()/dt/4));hitT=nowT}
      u.air=0;
    }else u.air=(u.air??1)+dt;
    const hc=hit?0xffd400:effColor(); // your hands are your color (yellow while touching something)
    u.m.material.color.setHex(hc);u.m.material.emissive.setHex(hc).multiplyScalar(0.4);
    if(hit){
      rig.position.add(pushOut);   // keep the hand on the surface
      avg.sub(dd);n++;             // body moves opposite to the hand
    }
    u.has=true;
  }
  if(n){
    avg.multiplyScalar(1/n);
    rig.position.add(avg);
    avg.multiplyScalar(1/dt);if(avg.length()>MAXV)avg.setLength(MAXV);
    vel.lerp(avg,0.7);             // carried as launch speed after letting go
  }else{
    vel.y-=GRAV*dt;
    const f=Math.pow(0.6,dt);vel.x*=f;vel.z*=f;
    rig.position.addScaledVector(vel,dt);
  }
  // no leg/body floor collider: only your hands touch the ground. Failsafe if you fall out of the world:
  if(rig.position.y<-6){rig.position.y=0;vel.set(0,0,0)}
  rig.position.y=Math.min(rig.position.y,8);
  clampRig();
}

  try{

    micSrc=AC.createMediaStreamSource(s);micSrc.connect(micGain);

function hookCall(c){

const MAX_PLAYERS=8,PUB_SLOTS=6;
function mpHost(tries=0,fixed=null){
  if(typeof Peer==='undefined'){mpmsg.textContent='The multiplayer library did not load. Check your connection.';return}
  mpLeave();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let code=fixed||'';
  if(!fixed)for(let i=0;i<4;i++)code+=A[Math.floor(Math.random()*A.length)];
  mpmsg.textContent='Creating room...';
  const p=peer=new Peer('gunke-'+code);
  p.on('open',()=>{
    online=true;isHost=true;hostPid=p.id;answerCalls(p);roomCode=code;uiDirty=true;
    mpmsg.textContent=fixed?'You opened public lobby '+code.slice(3)+'. Anyone can join it from the lobby list.'
      :'Hosting room '+code+'. Friends use JOIN CODE on the computer, or open this page with #'+code+' on the end.';
  });
  p.on('connection',c=>{
    if(c.metadata&&c.metadata.probe){ // lobby list peeking at this room
      c.on('open',()=>{c.send({t:'info',n:conns.length+1,max:MAX_PLAYERS,level});setTimeout(()=>{try{c.close()}catch(e){}},500)});
      return;
    }
    if(conns.length+1>=MAX_PLAYERS){
      c.on('open',()=>{c.send({t:'full'});setTimeout(()=>{try{c.close()}catch(e){}},300)});
      return;
    }
    conns.push(c);
    c.on('open',()=>{c.send(levelMsg());c.send({t:'peers',ids:[p.id,...conns.filter(x=>x!==c).map(x=>x.peer)]});mpmsg.textContent='Room '+code+': '+conns.length+' other player'+(conns.length>1?'s':'')+' connected.'});
    c.on('data',m=>hostRecv(c,m));
    const gone=()=>{conns=conns.filter(x=>x!==c);removeRemote(c.peer);dropVoice(c.peer);bcast({t:'x',id:c.peer})};
    c.on('close',gone);c.on('error',gone);
  });
  p.on('error',e=>{
    if(e.type==='unavailable-id'&&fixed)mpJoin(fixed); // someone else just opened this lobby: join it instead
    else if(e.type==='unavailable-id'&&tries<5)mpHost(tries+1);

}
function mpJoin(code){

  if(typeof Peer==='undefined'){mpmsg.textContent='The multiplayer library did not load. Check your connection.';return}
  mpLeave();

  const p=peer=new Peer();
  hostPid='gunke-'+code;answerCalls(p);
  p.on('open',()=>{
    const c=p.connect('gunke-'+code,{reliable:true});
    c.on('open',()=>{toHost=c;online=true;isHost=false;roomCode=code;uiDirty=true;mpmsg.textContent='Joined room '+code+'.'});
    c.on('data',clientRecv);
    c.on('close',()=>{if(peer===p){mpLeave();spawn();mpmsg.textContent='The room closed.'}});
  });

}
// ---------- public lobby: 6 fixed rooms (PUB1..PUB6). Nobody needs to know a code. ----------
// Each room is just a host on a fixed id. We peek at them to show who is in what, and an empty one can be opened by anyone.
let scanning=false;
function lobbyScan(cb){
  if(typeof Peer==='undefined'){cb(null);return}
  const res=Array(PUB_SLOTS).fill(null),settles=[];
  let left=PUB_SLOTS,done=false;
  const p=new Peer();
  const fin=()=>{if(done)return;done=true;try{p.destroy()}catch(e){}cb(res.map(r=>r||{n:0}))};
  setTimeout(fin,5000);
  p.on('error',e=>{
    const m=/PUB(\d)/.exec((e&&e.message)||'');
    if(m&&settles[m[1]-1])settles[m[1]-1]();
  });
  p.on('open',()=>{
    for(let i=0;i<PUB_SLOTS;i++){
      let settled=false,t=null;
      const settle=()=>{if(settled)return;settled=true;clearTimeout(t);if(--left===0)fin()};
      settles[i]=settle;
      const c=p.connect('gunke-PUB'+(i+1),{metadata:{probe:true}});
      c.on('data',m=>{if(m.t==='info'){res[i]={n:m.n,max:m.max,level:m.level};settle()}});
      c.on('error',settle);
      t=setTimeout(settle,3500);
    }
  });
}
function quickPlay(){
  if(scanning)return;

  scanning=true;
  lobbyScan(rooms=>{
    scanning=false;
    if(!rooms){mpmsg.textContent='The multiplayer library did not load. Check your connection.';return}
    let best=-1;
    rooms.forEach((r,i)=>{if(r.n>0&&r.n<(r.max||MAX_PLAYERS)&&(best<0||r.n>rooms[best].n))best=i});
    if(best>=0)mpJoin('PUB'+(best+1));
    else{const e=rooms.findIndex(r=>!r.n);if(e>=0)mpHost(0,'PUB'+(e+1));else mpmsg.textContent='All public lobbies are full right now.'}
    lobbyRefresh();
  });
}

const mrN=new THREE.Vector3(),mrPos=new THREE.Vector3(),mrCam=new THREE.Vector3(),mrRot=new THREE.Matrix4(),mrLook=new THREE.Vector3(),
  mrView=new THREE.Vector3(),mrTgt=new THREE.Vector3(),mrPlane=new THREE.Plane(),mrClip=new THREE.Vector4(),mrQ=new THREE.Vector4(),mrVC=new THREE.PerspectiveCamera();
mirror.onBeforeRender=function(rend,sc,cam){
  mrPos.setFromMatrixPosition(mirror.matrixWorld);
  mrCam.setFromMatrixPosition(cam.matrixWorld);
  mrRot.extractRotation(mirror.matrixWorld);
  mrN.set(0,0,1).applyMatrix4(mrRot);
  mrView.subVectors(mrPos,mrCam);
  if(mrView.dot(mrN)>0)return; // you are behind the mirror
  mrView.reflect(mrN).negate();mrView.add(mrPos);
  mrRot.extractRotation(cam.matrixWorld);
  mrLook.set(0,0,-1).applyMatrix4(mrRot).add(mrCam);
  mrTgt.subVectors(mrPos,mrLook);mrTgt.reflect(mrN).negate();mrTgt.add(mrPos);
  mrVC.position.copy(mrView);mrVC.up.set(0,1,0).applyMatrix4(mrRot).reflect(mrN);
  mrVC.lookAt(mrTgt);mrVC.far=cam.far;mrVC.updateMatrixWorld();
  mrVC.projectionMatrix.copy(cam.projectionMatrix);
  mirTexM.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1);
  mirTexM.multiply(mrVC.projectionMatrix).multiply(mrVC.matrixWorldInverse).multiply(mirror.matrixWorld);
  // clip everything behind the mirror plane (oblique near plane)
  mrPlane.setFromNormalAndCoplanarPoint(mrN,mrPos).applyMatrix4(mrVC.matrixWorldInverse);
  mrClip.set(mrPlane.normal.x,mrPlane.normal.y,mrPlane.normal.z,mrPlane.constant);
  const pm=mrVC.projectionMatrix.elements;
  mrQ.x=(Math.sign(mrClip.x)+pm[8])/pm[0];mrQ.y=(Math.sign(mrClip.y)+pm[9])/pm[5];mrQ.z=-1;mrQ.w=(1+pm[10])/pm[14];
  mrClip.multiplyScalar(2/mrClip.dot(mrQ));
  pm[2]=mrClip.x;pm[6]=mrClip.y;pm[10]=mrClip.z+1;pm[14]=mrClip.w;
  // draw the scene from the mirrored camera
  poseSelf();
  const prevRT=rend.getRenderTarget(),prevXR=rend.xr.enabled;

};

// YTINU: the skin creator. Open the YTINU tab on the Gunke Watch, press EDIT, and you land in a

const FINGER_SC={thumb:[1.06,0.68],middle:[1,1],pinky:[0.81,0.73]}; // xy size, length

const ytGeo=[new THREE.SphereGeometry(0.5,16,12),new THREE.BoxGeometry(1,1,1),new THREE.CylinderGeometry(0.5,0.5,1,16),new THREE.ConeGeometry(0.5,1,16),new THREE.TorusGeometry(0.5,0.1,8,24)];

function ytCleanPrims(a){

  if(Math.abs(ax[0])>0.2)lz=1+ax[0]*dt*0.9;     // thumbstick right = longer (Z)
  if(k!==1||lz!==1){
    p[7]=Math.max(0.002,Math.min(3,p[7]*k));p[8]=Math.max(0.002,Math.min(3,p[8]*k));p[9]=Math.max(0.002,Math.min(3,p[9]*k*lz));
    m.scale.set(p[7]*S,p[8]*S,p[9]*S);
  }
  ytV2.copy(h.offP).applyMatrix4(c.matrixWorld);   // where the piece should be
  ytQ2.copy(ytQ1).multiply(h.offQ);
  ytModel.updateMatrixWorld(true);ytModel.worldToLocal(ytV2);
  m.position.copy(ytV2);m.quaternion.copy(ytQ2);
  ytE.setFromQuaternion(ytQ2,'XYZ');
  p[1]=+(ytV2.x/S).toFixed(4);p[2]=+(ytV2.y/S).toFixed(4);p[3]=+(ytV2.z/S).toFixed(4);
  p[4]=+(ytE.x/D2R).toFixed(1);p[5]=+(ytE.y/D2R).toFixed(1);p[6]=+(ytE.z/D2R).toFixed(1);
  ytPvDirty=true;
}
function ytPreviewTick(dt){
  if(!ytPv){ytPv=mkRemote(1);scene.remove(ytPv.g);scene.remove(ytPv.tag);ytG.add(ytPv.g)}
  const col=effColor();
  for(const mt of ytPv.mats){mt.color.setHex(col);mt.emissive.setHex(col).multiplyScalar(0.35)}
  if(ytPvDirty){ytPvT-=dt;if(ytPvT<=0){ytPvDirty=false;ytPvT=0.15;applyRemoteSkin(ytPv,ytWorkSkin());ytPv.hasSkin=true}}
  const t=performance.now()/1000,P=ytPv.parts;
  P[0][0].position.set(2.1,1.6,-1.55);
  P[1][0].position.set(1.68,1.12+Math.sin(t*1.3)*0.05,-1.35);
  P[2][0].position.set(2.52,1.12+Math.cos(t*1.1)*0.05,-1.35);
  ytPv.armOn=true;ytPv.hy=Math.sin(t*0.6)*0.5;
  for(let i=0;i<2;i++)ytPv.fc[i]=[0.5+0.5*Math.sin(t*1.7+i),0.5+0.5*Math.sin(t*1.3+i*2),0.5+0.5*Math.sin(t*2.1+i)];
  animateVRRemote(ytPv,Math.min(1,dt*8));
}
function ytTick(dt){
  ytPortal.rotation.y+=dt*1.2;
  ytEdM.color.setHex(effColor());ytEdM.emissive.setHex(effColor()).multiplyScalar(0.3);
  ytPreviewTick(dt);
  if(!renderer.xr.isPresenting)return;
  for(const c of hands){
    const u=c.userData,gp=u.src&&u.src.gamepad;if(!gp)continue;
    const hn=(u.hand==='left'||u.hand==='right')?u.hand:(c===hands[0]?'left':'right');
    const trig=!!(gp.buttons[0]&&gp.buttons[0].pressed),edge=trig&&!u.ytT;
    c.updateMatrixWorld(true);
    ytO.setFromMatrixPosition(c.matrixWorld);ytD.set(0,0,-1).transformDirection(c.matrixWorld);ytRay.set(ytO,ytD);
    if(ytHold&&ytHold.c===c){
      if(!trig){ytHold=null;ytChanged()}else ytMoveHeld(dt);
      if(u.laser){u.laser.visible=true;u.laser.scale.z=0.5}
      u.ytT=trig;continue;
    }
    if(wmHit&&hn!=='left'){u.ytT=trig;continue} // this hand is busy with the wrist screen
    const ph=ytRay.intersectObject(ytPanel,false)[0],pc=ytRay.intersectObjects(ytPieces,false)[0];
    const onPanel=!!ph&&(!pc||ph.distance<=pc.distance);
    let b=null,px=0,py=0;
    if(onPanel){px=ph.uv.x*UI_W;py=(1-ph.uv.y)*UI_H;b=ytFind(px,py)}
    if(u.laser){u.laser.visible=true;u.laser.scale.z=onPanel?ph.distance:(pc?pc.distance:2.5)}
    const hk=b?b.key:'';
    if(onPanel&&hk!==ytHover){ytHover=hk;ytDirty=true}
    if(edge){
      if(onPanel&&b){
        if(b.slider){u.ytSlide=b.slider;slideSet(b.slider,px)}else uiPress(b);
        buzz(gp);ytDirty=true;
      }else if(!onPanel&&pc){
        ytUndoPush();ytSelIdx=pc.object.userData.i;ytRebuildBench();
        const m=ytPieces.find(x=>x.userData.i===ytSelIdx);
        if(m){
          c.matrixWorld.decompose(ytV1,ytQ1,ytV2);
          const inv=new THREE.Matrix4().copy(c.matrixWorld).invert();
          m.updateMatrixWorld(true);
          const offP=m.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv);
          const offQ=ytQ1.clone().invert().multiply(m.getWorldQuaternion(new THREE.Quaternion()));
          ytHold={c,i:ytSelIdx,offP,offQ,hand:hn};
          buzz(gp);
        }
        ytDirty=true;
      }
    }
    if(trig&&u.ytSlide){const xp=ytPanelX(ytRay);if(xp!==null)slideSet(u.ytSlide,xp)}
    if(!trig&&u.ytSlide)u.ytSlide=null;
    u.ytT=trig;
  }
  if(ytDirty){ytDirty=false;drawYtPanel()}
}

// ---- zones ----
function goZone(z){
  const f=z==='pillars',c=z==='chill',y=z==='ytinu',old=zone;zone=z;
  stumpG.visible=z==='stump';pillarsG.visible=f;chillG.visible=c;ytG.visible=y;
  floor.visible=!c&&!y; // the big grass floor is outside the rooms
  // gloomy dark void in the chill room, plain gray in the Ytinu editor
  const bgc=c?0x07040d:(y?0x474747:0x99d9ea);
  scene.background.setHex(bgc);scene.fog.color.setHex(bgc);
  scene.fog.near=c?3:(y?10:12);scene.fog.far=c?14:(y?45:55);hemi.intensity=c?0:0.9;
  if(y)ytOnEnter();else ytHold=null;
  vel.set(0,0,0);rig.position.set(0,0,f?0:c?0.9:(y?0.8:0.5));rig.rotation.y=0;yaw=0;pitch=0;
  if(f)showPop(got+' / '+total,'Level '+level+' coins');else popup.visible=false;
  portalCD=1.2;uiDirty=true;
  if(old!==z)tone(260,0.35,'sine',0.2,900);
}
function startGame(kind){ // 'pc' | 'mobile' (VR starts through enter())
  initAudio();touchMode=kind==='mobile';
  menu.style.display='none';goZone('stump');
}
function stumpTick(dt,xr){
  const f=zone==='pillars',st=zone==='stump';
  for(const p of pillars)p.visible=f;
  for(const o of orbs)o.visible=f;
  stumpPortal.rotation.y+=dt*1.2;backPortal.rotation.y+=dt*1.2;stumpChillPortal.rotation.y+=dt*1.2;
  if(zone==='chill'&&chillAnim)chillAnim(performance.now()/1000,dt);
  if(menu.style.display==='none'){
    if(portalCD>0)portalCD-=dt;
    else if(hp.y<2.8){
      const near=P=>Math.hypot(hp.x-P.x,hp.z-P.z)<1.1;
      if(st){if(near(STUMP_TO_PILLARS))goZone('pillars');else if(near(STUMP_TO_CHILL))goZone('chill')}
      else if(f){if(near(PILLARS_BACK))goZone('stump')}
      else if(zone==='chill'){if(near(CHILL_BACK))goZone('stump')}
      else if(near(YT_BACK))goZone('stump');
    }
  }
  if(st){if(xr)vrUI()}
  else for(const c of hands)if(c.userData.laser)c.userData.laser.visible=false;
  if(st||wristOn){ // the computer screen, or the wrist copy of it
    uiT-=dt;if(uiT<=0){uiT=0.5;uiDirty=true}
    if(uiDirty){uiDirty=false;if(st)drawUI();if(wristOn)drawWatch()}
  }
}

// ---------- main loop ----------
let last=performance.now(),snapReady=true,abPrev=false,arrowHeld=false,yPrev=false;
renderer.setAnimationLoop(()=>{
  const now=performance.now(),dt=Math.min((now-last)/1000,0.1);last=now;
  const xr=renderer.xr.isPresenting;let sx=0,sy=0,turn=0,ab=false;
  const wantJoy=touchMode&&!xr&&menu.style.display==='none';
  if(wantJoy!==joyShown){joyShown=wantJoy;joyWrap.style.display=wantJoy?'block':'none';if(!wantJoy){joyX=joyY=0;joyKnob.style.transform=''}}
  if(xr){
    let bNow=false,yNow=false;
    for(const src of renderer.xr.getSession().inputSources){
      const g=src.gamepad;if(!g)continue;
      if(g.buttons[5]&&g.buttons[5].pressed){if(src.handedness==='left')yNow=true;else bNow=true} // Y = wrist menu, B = mute the mic
      const a=g.axes,x=a[2]??a[0]??0,y=a[3]??a[1]??0;
      ytAx[src.handedness]=[x,y];if(ytHeld(src.handedness))continue; // holding a piece: the stick resizes it
      if(src.handedness==='right')turn=x;else if(src.handedness==='left'&&Math.hypot(x,y)>0.15){sx=x;sy=y}
    }
    if(bNow&&!bPrevMute)toggleMute();bPrevMute=bNow;
    if(yNow&&!yPrev)toggleWrist();yPrev=yNow;
    if(turnMode==='smooth'){if(Math.abs(turn)>0.15)rig.rotation.y-=turn*dt*2.2}
    else if(Math.abs(turn)>0.7){if(snapReady){rig.rotation.y-=Math.sign(turn)*Math.PI/6;snapReady=false}}else snapReady=true;
  }else{
    camera.rotation.set(pitch,yaw,0,'YXZ');
    sx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joyX;sy=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joyY;
    const tl=(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0); // arrow keys turn too
    if(turnMode==='smooth')yaw+=tl*2*dt;else if(tl&&!arrowHeld)yaw+=tl*Math.PI/6;
    arrowHeld=!!tl;
  }
  if(xr)updateFingers(dt);
  const armMv=xr&&moveMode==='arm'&&zone!=='ytinu'; // the editor is walk-only
  if(armMv)gorilla(dt);
  else{
    if(xr)for(const c of hands){const hc=effColor(),m=c.userData.m.material;m.color.setHex(hc);m.emissive.setHex(hc).multiplyScalar(0.4)}
    if(sx||sy)move(dt,sx,sy);
    rig.position.y=Math.max(0,rig.position.y-10*dt);
  }
  if(armMv){rig.updateMatrixWorld(true);renderer.xr.getCamera(camera).getWorldPosition(hp)}else collide();
  if(isClient())netPillars(dt);
  else{
    updatePillars(dt);
    if(isHost){plT-=dt;if(plT<=0){plT=0.1;bcast({t:'pl',d:pillars.map(p=>f2([p.position.x,p.position.y,p.position.z]))})}}
  }
  if(online){
    netT-=dt;
    if(netT<=0){netT=0.05;const s=myState();if(isHost)bcast({...s,id:'host'});else if(toHost&&toHost.open)toHost.send(s)}
  }
  updateRemotes(dt);
  updateVoices();
  if(bannerT>0)bannerT-=dt;
  updatePop(dt);
  stumpTick(dt,xr);

  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.rotation.y+=dt*2;o.position.y+=Math.sin(now/400+i)*0.002;
    if(zone==='pillars'&&Math.hypot(o.position.x-hp.x,o.position.z-hp.z)<0.8&&Math.abs(o.position.y-hp.y)<1.5){
      if(isClient()){scene.remove(o);orbs.splice(i,1);if(toHost&&toHost.open)toHost.send({t:'got',i:o.userData.id})}
      else hostGot(o.userData.id);
    }
  }
  updateWrist(dt);
  if(zone==='ytinu')ytTick(dt);
  updateLocalArms();
  renderer.render(scene,camera);
});
spawn();
</script>
